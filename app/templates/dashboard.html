<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Athleticore Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="dashboard-body">
   <nav class="top-nav">
        <div class="logo">ATHLETICORE<span class="ai-text">.AI</span></div>
        
        <ul class="nav-links">
            <li><a href="/dashboard" class="active">Dashboard</a></li>
            <li><a href="/tdee">TDEE</a></li>
            <li><a href="/calories">Calories</a></li>
            <li><a href="/workout">Workout</a></li>
            <li><a href="/coach">Coach</a></li>
            <li><a href="/settings">Settings</a></li>
        </ul>
   </nav>
   <main class="main-content">
        <div class="hero-text">
            <h1 class="typing-effect" id="welcome-heading">Welcome Back, Athlete.</h1>
            <p class="subtitle">Your data is ready.</p>
        </div>

        <div class="dashboard-cards">
            <div class="card" data-tilt>
                <h3>Calories Left</h3>
                <div class="progress-container" style="width: 160px; height: 160px;">
                    <svg class="progress-ring" width="160" height="160">
                        <circle class="progress-ring__circle-bg"
                            stroke="#333" stroke-width="10" fill="transparent"
                            r="70" cx="80" cy="80"/>
                        
                        <circle class="progress-ring__circle"
                            stroke="#00A8FF" stroke-width="10" fill="transparent"
                            r="70" cx="80" cy="80"/>
                    </svg>
                    
                    <div class="progress-text">
                        <span class="cal-value" id="calories-left-value">0</span>
                        <span class="cal-label">kcal</span>
                    </div>
                </div>
            </div>
            
            <div class="card" data-tilt>
                <h3>Current Goal</h3>
                <div class="big-number" id="current-goal">-</div>
            </div>
            
            <div class="card" data-tilt>
                <h3>Next Workout</h3>
                <div class="big-number" id="next-workout">-</div>
            </div>
        </div>
   </main>
   <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
   <script>
    // Get user from localStorage
    const storedUser = localStorage.getItem('athleticore_user');
    let currentUser = null;
    
    if (storedUser) {
        try {
            currentUser = JSON.parse(storedUser);
            if (currentUser?.username) {
                const heading = document.getElementById('welcome-heading');
                heading.textContent = `Welcome Back, ${currentUser.username}.`;
            }
        } catch (err) {
            console.error('Failed to parse stored user', err);
        }
    }

    // --- PART 1: 3D TILT EFFECT ---
    VanillaTilt.init(document.querySelectorAll(".card"), {
        max: 15,
        speed: 400,
        glare: true,
        "max-glare": 0.5
    });

    // --- PART 2: Load Dashboard Data and Update Circle ---
    async function loadDashboardData() {
        if (!currentUser || !currentUser.id) {
            console.log('No user found');
            return;
        }
        
        try {
            const response = await fetch(`/api/dashboard?user_id=${currentUser.id}`);
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error || 'Failed to load dashboard data');
            }
            
            const data = await response.json();
            
            // Update Current Goal
            const currentGoalEl = document.getElementById('current-goal');
            if (currentGoalEl && data.current_goal) {
                const goalText = data.current_goal.charAt(0).toUpperCase() + data.current_goal.slice(1);
                currentGoalEl.textContent = goalText;
            }
            
            // Update Next Workout
            const nextWorkoutEl = document.getElementById('next-workout');
            if (nextWorkoutEl) {
                if (data.next_workout) {
                    nextWorkoutEl.textContent = data.next_workout;
                } else {
                    nextWorkoutEl.textContent = 'No workout scheduled';
                }
            }
            
            // Update Calories Left
            const caloriesLeftEl = document.getElementById('calories-left-value');
            if (caloriesLeftEl) {
                caloriesLeftEl.textContent = Math.round(data.calories_left).toLocaleString();
            }
            
            // Update Circle Progress
            const circle = document.querySelector('.progress-ring__circle');
            if (circle) {
                const radius = circle.r.baseVal.value;
                const circumference = radius * 2 * Math.PI;
                
                // Set the circle line length
                circle.style.strokeDasharray = `${circumference} ${circumference}`;
                circle.style.strokeDashoffset = circumference;
                
                // Function to set progress
                function setProgress(percent) {
                    const offset = circumference - (percent / 100) * circumference;
                    circle.style.strokeDashoffset = offset;
                }
                
                // Animate to the actual progress percentage
                setTimeout(() => {
                    setProgress(data.calorie_progress_percent || 0);
                }, 500);
            }
            
        } catch (error) {
            console.error('Error loading dashboard data:', error);
        }
    }
    
    // Load data when page loads
    document.addEventListener('DOMContentLoaded', () => {
        loadDashboardData();
    });
</script>
</body>
</html>
