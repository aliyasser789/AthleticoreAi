<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account Settings - Athleticore.AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body class="dashboard-body">
    <nav class="top-nav">
        <div class="logo">ATHLETICORE<span class="ai-text">.AI</span></div>
        
        <ul class="nav-links">
            <li><a href="/dashboard">Dashboard</a></li>
            <li><a href="/tdee">TDEE</a></li>
            <li><a href="/calories">Calories</a></li>
            <li><a href="/workout">Workout</a></li>
            <li><a href="/coach">Coach</a></li>
            <li><a href="/settings" class="active">Settings</a></li>
        </ul>
    </nav>
    
    <main class="main-content">
        <div class="settings-container">
            <h1 class="settings-header">Account Settings</h1>
            
            <form id="settings-form" class="settings-form">
                <div class="settings-grid">
                    <!-- LEFT COLUMN: Account Security -->
                    <div class="settings-card">
                        <h2 class="settings-card-title">Account Security</h2>
                        
                        <div class="input-group">
                            <label for="username">Username</label>
                            <div class="input-with-icon">
                                <input type="text" id="username" name="username" class="settings-input">
                                <span class="edit-icon">✎</span>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="email">Email</label>
                            <div class="input-with-icon">
                                <input type="email" id="email" name="email" class="settings-input">
                                <span class="edit-icon">✎</span>
                            </div>
                        </div>
                        
                        <div class="input-group">
                            <label for="password">Password</label>
                            <div class="input-with-icon">
                                <input type="password" id="password" name="password" class="settings-input">
                                <span class="eye-icon" id="toggle-password">👁</span>
                            </div>
                        </div>
                        
                        <div class="input-group" id="confirm-password-group" style="display: none;">
                            <label for="confirm-password">Confirm Password</label>
                            <input type="password" id="confirm-password" name="confirm-password" class="settings-input">
                        </div>
                    </div>
                    
                    <!-- RIGHT COLUMN: Body Stats -->
                    <div class="settings-card">
                        <h2 class="settings-card-title">Body Stats</h2>
                        
                        <div class="input-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" class="settings-input" min="1" max="150">
                        </div>
                        
                        <div class="input-group">
                            <label for="height">Height (cm)</label>
                            <input type="number" id="height" name="height" class="settings-input" min="1" max="300" step="0.1">
                        </div>
                        
                        <div class="input-group">
                            <label for="weight">Weight (kg)</label>
                            <input type="number" id="weight" name="weight" class="settings-input" min="1" max="500" step="0.1">
                        </div>
                    </div>
                </div>
                
                <div class="settings-actions">
                    <button type="submit" class="save-btn settings-save-btn">Save Changes</button>
                </div>
            </form>
            
            <div class="settings-actions-bottom">
                <button type="button" class="logout-btn" id="logout-btn">Logout</button>
            </div>
        </div>
    </main>
    
    <!-- Toast Notification Container -->
    <div class="toast-container" id="toast-container"></div>
    
    <script>
        // Toast notification function
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            if (!container) return;
            
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'success' ? '✓' : '✕';
            toast.innerHTML = `
                <span class="toast-icon">${icon}</span>
                <span class="toast-message">${message}</span>
            `;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => {
                toast.classList.add('show');
            }, 10);
            
            // Remove toast after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                    }
                }, 300);
            }, 3000);
        }
        
        // Get user from localStorage
        function getUser() {
            const storedUser = localStorage.getItem('athleticore_user');
            if (!storedUser) {
                return null;
            }
            try {
                return JSON.parse(storedUser);
            } catch (err) {
                console.error('Failed to parse stored user', err);
                return null;
            }
        }
        
        // Load settings from backend
        async function loadSettings() {
            const user = getUser();
            if (!user || !user.id) {
                showToast('Please log in first', 'error');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
                return;
            }
            
            try {
                // Show loading state
                const usernameField = document.getElementById('username');
                const emailField = document.getElementById('email');
                const ageField = document.getElementById('age');
                const heightField = document.getElementById('height');
                const weightField = document.getElementById('weight');
                
                // Set placeholder to indicate loading
                usernameField.placeholder = 'Loading...';
                emailField.placeholder = 'Loading...';
                
                // Ensure user_id is a number
                const userId = parseInt(user.id);
                if (isNaN(userId)) {
                    throw new Error('Invalid user ID');
                }
                
                console.log('Loading settings for user_id:', userId);
                const response = await fetch(`/api/settings?user_id=${userId}`);
                console.log('Response status:', response.status, response.statusText);
                console.log('Response headers:', response.headers.get('content-type'));
                
                // Get response text first (can only read once)
                const responseText = await response.text();
                
                // Check if response is OK
                if (!response.ok) {
                    let errorMessage = 'Failed to load settings';
                    try {
                        const errorData = JSON.parse(responseText);
                        errorMessage = errorData.error || errorMessage;
                    } catch (e) {
                        // If response is not JSON, use the text as error message
                        errorMessage = responseText || errorMessage;
                    }
                    throw new Error(errorMessage);
                }
                
                // Parse JSON response
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch (e) {
                    console.error('JSON parse error:', e);
                    console.error('Response text:', responseText);
                    throw new Error('Invalid response from server. Please check the console for details.');
                }
                
                const settings = data.settings;
                
                if (!settings) {
                    throw new Error('No settings data received');
                }
                
                // Populate form fields with database values
                usernameField.value = settings.username || '';
                emailField.value = settings.email || '';
                ageField.value = settings.age || '';
                heightField.value = settings.height || '';
                weightField.value = settings.weight || '';
                
                // Reset placeholders
                usernameField.placeholder = '';
                emailField.placeholder = '';
                
                console.log('Settings loaded successfully:', settings);
                
            } catch (error) {
                console.error('Error loading settings:', error);
                showToast('Error loading settings: ' + error.message, 'error');
                
                // Reset placeholders on error
                const usernameField = document.getElementById('username');
                const emailField = document.getElementById('email');
                if (usernameField) usernameField.placeholder = '';
                if (emailField) emailField.placeholder = '';
            }
        }
        
        // Show Password Toggle
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');
        const confirmPasswordGroup = document.getElementById('confirm-password-group');
        const confirmPasswordInput = document.getElementById('confirm-password');
        
        togglePassword.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                togglePassword.textContent = '👁‍🗨';
            } else {
                passwordInput.type = 'password';
                togglePassword.textContent = '👁';
            }
        });
        
        // Show confirm password when password field is focused and has value
        passwordInput.addEventListener('focus', function() {
            if (passwordInput.value.length > 0) {
                confirmPasswordGroup.style.display = 'block';
            }
        });
        
        passwordInput.addEventListener('input', function() {
            if (passwordInput.value.length > 0) {
                confirmPasswordGroup.style.display = 'block';
            } else {
                confirmPasswordGroup.style.display = 'none';
                confirmPasswordInput.value = '';
            }
        });
        
        // Save Logic
        const settingsForm = document.getElementById('settings-form');
        settingsForm.addEventListener('submit', async function(event) {
            event.preventDefault();
            
            const user = getUser();
            if (!user || !user.id) {
                showToast('Please log in first', 'error');
                setTimeout(() => {
                    window.location.href = '/login';
                }, 1500);
                return;
            }
            
            // Get form values
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const ageValue = document.getElementById('age').value.trim();
            const heightValue = document.getElementById('height').value.trim();
            const weightValue = document.getElementById('weight').value.trim();
            
            // Basic validation
            if (!username) {
                showToast('Username is required', 'error');
                return;
            }
            if (!email) {
                showToast('Email is required', 'error');
                return;
            }
            
            // Validate password if provided
            if (password) {
                if (!confirmPassword) {
                    showToast('Please confirm your password', 'error');
                    return;
                }
                if (password !== confirmPassword) {
                    showToast('Passwords do not match', 'error');
                    return;
                }
            }
            
            // Parse numeric values
            const age = ageValue ? parseInt(ageValue) : null;
            const height = heightValue ? parseInt(heightValue) : null;
            const weight = weightValue ? parseInt(weightValue) : null;
            
            // Validate numeric fields
            if (age !== null && (isNaN(age) || age <= 0)) {
                showToast('Age must be a positive number', 'error');
                return;
            }
            if (height !== null && (isNaN(height) || height <= 0)) {
                showToast('Height must be a positive number', 'error');
                return;
            }
            if (weight !== null && (isNaN(weight) || weight <= 0)) {
                showToast('Weight must be a positive number', 'error');
                return;
            }
            
            // Build payload with all fields
            const payload = {
                user_id: user.id,
                username: username,
                email: email
            };
            
            // Add optional fields only if they have values
            if (password) {
                payload.password = password;
                payload.confirm_password = confirmPassword;
            }
            if (age !== null) payload.age = age;
            if (height !== null) payload.height = height;
            if (weight !== null) payload.weight = weight;
            
            // Disable submit button
            const submitBtn = settingsForm.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving...';
            
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Failed to update settings');
                }
                
                // Update localStorage with new settings
                if (data.settings) {
                    user.username = data.settings.username;
                    user.email = data.settings.email;
                    user.age = data.settings.age;
                    user.height = data.settings.height;
                    user.weight = data.settings.weight;
                    localStorage.setItem('athleticore_user', JSON.stringify(user));
                }
                
                // Clear password fields
                document.getElementById('password').value = '';
                document.getElementById('confirm-password').value = '';
                document.getElementById('confirm-password-group').style.display = 'none';
                
                showToast('Settings saved successfully!', 'success');
                
            } catch (error) {
                console.error('Error saving settings:', error);
                showToast('Error: ' + error.message, 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Save Changes';
            }
        });
        
        // Logout Logic
        const logoutBtn = document.getElementById('logout-btn');
        logoutBtn.addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('athleticore_user');
                window.location.href = '/login';
            }
        });
        
        // Load settings when page loads
        let settingsLoaded = false;
        
        function initializeSettings() {
            if (settingsLoaded) return;
            settingsLoaded = true;
            
            // Wait a tiny bit to ensure all elements are ready
            setTimeout(() => {
                loadSettings();
            }, 100);
        }
        
        if (document.readyState === 'loading') {
            // DOM is still loading, wait for DOMContentLoaded
            document.addEventListener('DOMContentLoaded', initializeSettings);
        } else {
            // DOM is already loaded
            initializeSettings();
        }
    </script>
</body>
</html>
